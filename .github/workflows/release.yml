name: 0.13.10

on:
  push:
    tags: [ '*' ]

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    container: erlang:${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28', '27', '26', '25', '24', '23', '22', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile
        run: rebar3 compile

      - name: EUnit and Common Test
        run: rebar3 as test clean -a && rebar3 eunit && rebar3 ct
