name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    container: erlang:${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28', '27', '26', '25', '24', '23', '22', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        if: matrix.otp != '21'
        run: rebar3 fmt --check

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        run: rebar3 as test clean && rebar3 ct
