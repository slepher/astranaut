name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28.0', '27.2', '26.2', '25.3', '24.3', '23.3', '21.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'

      - name: Cache rebar3 deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: ${{ runner.os }}-rebar3-${{ matrix.otp }}-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-${{ matrix.otp }}-

      - name: Compile deps
        run: rebar3 compile --deps_only

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        run: rebar3 as test clean && rebar3 ct
